"Un calcul juste ne suffit pas toujours : il faut interpréter ce que représentent les nombres, vérifier les unités et repérer les hypothèses. Les exemples particuliers aident à construire une intuition, tandis que les démonstrations établissent ce qui est vrai dans le cas général."
],
'Physique et chimie':[
"La physique cherche des lois quantitatives pour décrire les phénomènes naturels ; la chimie étudie notamment la composition et les transformations de la matière. Toutes deux relient des observations à des modèles que l'on peut tester expérimentalement.",
"Un modèle n'est utile que dans un domaine de validité. Pour résoudre un problème, il faut identifier les grandeurs, les unités, les interactions et les conditions de l'expérience. Les ordres de grandeur sont souvent aussi instructifs que les valeurs exactes."
],
'Économie et société':[

"Une corrélation ne suffit pas à établir une causalité. Pour interpréter un phénomène social, on compare des situations, on examine les mécanismes possibles et on distingue les constats des jugements de valeur. Les décisions publiques impliquent souvent des arbitrages."

function courseArticle(lesson,domain){
 const context=editorialContext[domain.name]||[];
 const unique=[...new Set(lesson.questions.map(q=>q.explanation).filter(x=>x&&x!==lesson.text))];
 const passage=unique.slice(0,3).map(x=>'<p>'+escapeHTML(x)+'</p>').join('');
 return '<article class="reading-page">'+
 '<p class="lead">'+escapeHTML(lesson.text)+'</p>'+
 '<h3>Comprendre le sujet</h3><p>'+escapeHTML(context[0]||'')+'</p>'+
 '<h3>Comment cela fonctionne</h3><p>'+escapeHTML(lesson.example)+'</p>'+passage+
 '<h3>Prendre du recul</h3><p>'+escapeHTML(context[1]||'')+'</p>'+
 '<p class="reading-close">À présent, prenez un instant pour relier ces idées entre elles. Le questionnaire qui suit vérifie votre compréhension du cours, sans reprendre son texte mot pour mot.</p>'+
 '</article>';
}
function balancedShuffle(items){
  const list=shuffle(items);
  try{
    const previous=JSON.parse(localStorage.getItem('mindgap-last-order')||'[]');
    if(list.length>1&&list[0].id===previous[0])list.push(list.shift());
    localStorage.setItem('mindgap-last-order',JSON.stringify(list.map(q=>q.id)));
  }catch{}
  return list;
}
function courseForMath(items){
  return '<div class="course-point"><div><strong>Calculs et méthode</strong><p>Pour multiplier, décompose les facteurs. Pour résoudre x + a = b, soustrais a des deux côtés. Pour un pourcentage, multiplie le taux divisé par 100 par la quantité. Pour une fonction f(x)=ax+b, remplace x par sa valeur puis calcule.</p></div></div>';
}

function openLesson(lesson){
  const domain=domains.find(d=>d.lessons.includes(lesson));
  const unseen=lesson.questions.filter(isNew);
  const items=adaptiveItems(lesson);
  recordDomain(lesson);
  show('<div class="eyebrow">Lecture · '+escapeHTML(domain.name)+'</div>'+
    '<h2>'+escapeHTML(lesson.title)+'</h2>'+
    courseArticle(lesson,domain)+
    '<div class="actions"><button class="primary" id="launch">Tester ma compréhension</button>'+back+'</div>',true);
  byId('launch').onclick=()=>launch(lesson.title,items);
  if(domainOf(lesson)===5){const b=document.createElement('button');b.textContent='Défi mathématique inédit';b.onclick=()=>{const generated=[generatedMath(),generatedMath(),generatedMath()];show('<div class="eyebrow">Méthode avant le défi</div><h2>Calculs variés</h2>'+courseForMath(generated)+'<div class="actions"><button class="primary" id="math-go">Commencer le défi</button>'+back+'</div>',true);byId('math-go').onclick=()=>launch('Entraînement mathématique',generated);bindBack();};work.querySelector('.actions').append(b);}
  bindBack();
}
function shuffle(items){
  const list=[...items];
  for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]];}
  return list;
}
function launch(title,items,review=false){
  session={title,items:balancedShuffle(items),index:0,correct:0,review};
  ask();
}
function nextLesson(){
  const rounds=Math.max(...domains.map(d=>d.lessons.length));
  const ordered=Array.from({length:rounds},(_,i)=>domains.flatMap(d=>d.lessons.slice(i,i+1))).flat();
  const target=chooseLesson();
  if(target){openLesson(target);return;}
  const unfinished=lessons.filter(l=>mastery(l.questions)<100).sort((a,b)=>mastery(a.questions)-mastery(b.questions));
  if(unfinished.length){
    show('<div class="eyebrow">Toutes les notions ont été abordées</div>'+
      '<h2>Consolider mes acquis</h2><p>Reprenez une notion à consolider ou choisissez un autre sujet sur la carte.</p>'+
      '<div class="actions"><button id="consolidate" class="primary">Réviser une notion</button>'+back+'</div>',true);
    byId('consolidate').onclick=()=>openLesson(unfinished[0]);
    bindBack();
    return;
  }
  show('<h2>Parcours maîtrisé</h2><p>Vous avez validé les '+questions.length+' questions. Vous pouvez reprendre une leçon depuis la carte.</p>'+back);
  bindBack();
}
function ask(){
  const s=session,q=s.items[s.index], choices=shuffle(q.choices);
  show('<div class="eyebrow">'+(s.review?'Révision':'2 / 2 · Vérifier')+' · '+escapeHTML(s.title)+' · Question '+(s.index+1)+' / '+s.items.length+'</div><progress aria-label="Progression du quiz" max="'+s.items.length+'" value="'+s.index+'"></progress><h2>'+escapeHTML(q.prompt)+'</h2><div class="answers">'+choices.map((x,i)=>'<button data-answer="'+i+'">'+escapeHTML(x)+'</button>').join('')+'</div><div id="feedback" class="feedback" role="status"></div><button id="next" class="primary" hidden>'+(s.index+1===s.items.length?'Voir le résultat':'Question suivante')+'</button><div>'+back+'</div>',true);
  bindBack();
  const buttons=[...work.querySelectorAll('[data-answer]')];
  buttons.forEach((b,i)=>b.onclick=()=>{
    if(b.disabled)return;
    const correct=choices[i]===q.choices[0];
    if(correct)s.correct++;
    updateMemory(q,correct);
    persist();draw();
    buttons.forEach((item,j)=>{item.disabled=true;if(choices[j]===q.choices[0])item.classList.add('right');});
    if(!correct)b.classList.add('wrong');
    byId('feedback').innerHTML='<p><strong>'+(correct?'Bonne réponse.':'Réponse attendue · '+escapeHTML(q.choices[0]))+'</strong> '+escapeHTML(q.explanation)+'</p>';
    work.querySelector('progress').value=s.index+1;
    byId('next').hidden=false;
    byId('next').focus();
  });
  byId('next').onclick=()=>{s.index++;if(s.index<s.items.length)ask();else finish();};
}
function finish(){
  const s=session;
  show('<div class="eyebrow">Résultat du quiz</div><h2>'+s.correct+' / '+s.items.length+' bonnes réponses</h2><p>'+(s.review?'Les erreurs corrigées sont retirées de la liste.':'Le moteur adapte les révisions à vos réussites : demain, puis à intervalles croissants. Une erreur revient dans les révisions.')+'</p><div class="actions"><button id="continue" class="primary">Poursuivre le parcours</button>'+back+'</div>',true);
  byId('continue').onclick=nextLesson;
  bindBack();
}
byId('start').onclick=nextLesson;

byId('review').onclick=()=>{
  const items=errors();
  if(items.length){launch('Mes révisions',shuffle(items).slice(0,6),true);return;}
  show('<h2>Mes révisions</h2><p>Aucune erreur à revoir. Les questions manquées apparaîtront ici.</p>'+back);
  bindBack();
};
draw();
</script></body></html>
