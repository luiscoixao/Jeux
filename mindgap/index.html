<style>

button { min-height: 44px; font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); background: #162130; border-radius: 10px; padding: 10px 14px; transition: background .18s, border-color .18s; }
button:hover { border-color: var(--accent); background: #203247; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.panel { border: 1px solid var(--line); border-radius: 20px; background: var(--panel); overflow: hidden; }

.map {
  position: relative;
  isolation: isolate;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, .9fr) minmax(0, 1fr);

.map svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

.core strong { color: var(--accent); font-size: clamp(17px, 4vw, 39px); letter-spacing: -.055em; line-height: 1.08; }

.stats span { padding: 10px clamp(8px, 2.5vw, 24px); }
.stats span + span { border-left: 1px solid var(--line); }
.stats span:nth-child(4) { grid-column: 1 / -1; border-top: 1px solid var(--line); border-left: 0; }
.stats b { display: block; color: var(--ink); font-size: clamp(17px, 2.4vw, 24px); font-variant-numeric: tabular-nums; }
.below { margin-top: 14px; }
#work { padding: clamp(14px, 3vw, 30px); }
#work h2 { margin-top: 8px; }
#work p { max-width: 72ch; }
.lesson-body h3 { margin: 0 0 5px; font-size: 15px; }
.lesson-example { margin: 16px 0; padding: 12px 14px; border-left: 3px solid var(--accent); border-radius: 0 9px 9px 0; background: #162536; }

.rows, .answers { display: grid; gap: 8px; margin: 15px 0; }
.rows button, .answers button { display: flex; align-items: center; gap: 12px; text-align: left; }
.rows button { justify-content: space-between; }
.rows small { color: var(--status); white-space: nowrap; }
.answers { counter-reset: answer; }
.answers button::before { counter-increment: answer; content: counter(answer, upper-alpha); flex: 0 0 25px; text-align: center; padding: 2px 0; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); font: 700 12px/1.5 ui-monospace, monospace; }
.answers button:disabled:not(.right):not(.wrong) { opacity: .68; }
.answers .right { border-color: #79dfad; background: #16352c; }
.answers .wrong { border-color: #ff8995; background: #3b242e; }
.feedback:not(:empty) { border-left: 3px solid var(--accent); padding: 3px 12px; margin: 14px 0; color: var(--muted); }
.feedback p { margin: 0; }
.feedback strong { color: var(--ink); }
.status0 { --status: #ff8995; }
.status1 { --status: #ffb679; }
.status2 { --status: #f1d77d; }
.status3 { --status: #b3e58b; }
.status4 { --status: #72e9ae; }
progress { display: block; width: 100%; height: 7px; margin: 10px 0 16px; accent-color: var(--accent); }
[hidden] { display: none !important; }
.study-mode .hero, .study-mode #dashboard, .study-mode #storage-note { display: none; }
.study-mode #work { max-width: 720px; margin-inline: auto; }
#work #back { margin-top: 12px; }
#work .actions #back { margin-top: 0; }
@media (max-width: 520px) {
  .hero { gap: 14px; }
  .hero .actions button { font-size: 13px; padding-inline: 10px; }
  .map { min-height: 288px; grid-template-columns: minmax(0, 1fr) minmax(0, .68fr) minmax(0, 1fr); }
  .node b { display: none; }
  .core { width: 86%; padding: 3px; }
}
@media (prefers-reduced-motion: reduce) { button { transition: none; } }

      {"title": "Révolutions politiques", "text": "En 1789, la Révolution française remet en cause la société d’ordres. La souveraineté nationale devient un principe central.", "questions": [{"id": "0-1-0", "prompt": "En quelle année la Bastille est-elle prise ?", "choices": ["1789", "1792", "1815"], "explanation": "La Bastille est prise le 14 juillet 1789."}, {"id": "0-1-1", "prompt": "Quel texte proclame l’égalité en droits en août 1789 ?", "choices": ["La Déclaration des droits de l’homme et du citoyen", "Le Code civil", "L’édit de Nantes"], "explanation": "Son premier article énonce que les hommes naissent et demeurent libres et égaux en droits."}, {"id": "0-1-2", "prompt": "Quel principe rompt avec l’idée que le pouvoir appartient au roi de droit divin ?", "choices": ["La souveraineté nationale", "Le droit d’aînesse", "Le pouvoir héréditaire"], "explanation": "La souveraineté appartient à la nation."}], "example": "Dans la société d’ordres, des privilèges varient selon le groupe auquel on appartient. En proclamant l’égalité en droits, la Déclaration de 1789 pose un principe commun aux citoyens."},
      {"title": "XXe siècle", "text": "Les deux guerres mondiales bouleversent les équilibres internationaux. Après 1945, l’ONU est créée et les États-Unis et l’URSS deviennent les deux pôles de la guerre froide.", "questions": [{"id": "0-2-0", "prompt": "Quel événement clôt les combats de la Première Guerre mondiale sur le front occidental ?", "choices": ["L’armistice du 11 novembre 1918", "Le traité de Rome", "La chute du mur de Berlin"], "explanation": "L’armistice précède le traité de Versailles, signé en 1919."}, {"id": "0-2-1", "prompt": "Quelle organisation naît en 1945 ?", "choices": ["L’ONU", "La Société des Nations", "L’Union européenne"], "explanation": "La Charte des Nations unies entre en vigueur en octobre 1945."}, {"id": "0-2-2", "prompt": "Quel événement symbolise la fin de la division de l’Europe pendant la guerre froide ?", "choices": ["La chute du mur de Berlin", "Le blocus de Berlin", "La crise de Cuba"], "explanation": "La chute du mur en 1989 précède la réunification allemande."}], "example": "En 1989, l’ouverture du mur de Berlin permet aux habitants de passer plus librement d’une partie de la ville à l’autre. La réunification allemande suit en 1990."},

      {"title": "Se repérer", "text": "La latitude mesure l’écart angulaire à l’équateur. La longitude mesure l’écart au méridien de référence.", "questions": [{"id": "1-0-0", "prompt": "Quelle ligne sépare les hémisphères Nord et Sud ?", "choices": ["L’équateur", "Le méridien de Greenwich", "Le tropique du Cancer"], "explanation": "L’équateur correspond à la latitude 0°."}, {"id": "1-0-1", "prompt": "Quel océan borde le Portugal continental ?", "choices": ["L’Atlantique", "Le Pacifique", "L’Indien"], "explanation": "La façade ouest du Portugal donne sur l’Atlantique."}, {"id": "1-0-2", "prompt": "Deux villes à 45° N ont en commun quoi ?", "choices": ["Leur latitude", "Leur longitude", "Leur fuseau horaire"], "explanation": "Elles sont sur le même parallèle."}], "example": "Lisbonne et Washington se trouvent près de 39° N. Elles sont à une latitude voisine, mais leurs longitudes diffèrent fortement."},
      {"title": "Reliefs et climats", "text": "L’altitude et le relief influencent les températures et les précipitations. L’air humide qui monte sur un versant se refroidit et peut donner de la pluie.", "questions": [{"id": "1-1-0", "prompt": "Quelle chaîne sépare notamment la France et l’Espagne ?", "choices": ["Les Pyrénées", "Les Carpates", "Les Apennins"], "explanation": "Les Pyrénées s’étendent de l’Atlantique à la Méditerranée."}, {"id": "1-1-1", "prompt": "Comment évolue généralement la température quand l’altitude augmente ?", "choices": ["Elle diminue", "Elle augmente", "Elle reste identique"], "explanation": "La température diminue généralement dans la basse atmosphère."}, {"id": "1-1-2", "prompt": "Pourquoi le versant exposé à un vent humide reçoit-il souvent plus de pluie ?", "choices": ["L’air y monte et se refroidit", "L’air y descend et se réchauffe", "Le sol y est plus proche du Soleil"], "explanation": "Le refroidissement favorise la condensation."}], "example": "Imaginez un vent humide venant de l’Atlantique qui rencontre une montagne. En montant, l’air refroidit et peut donner de la pluie avant de redescendre plus sec de l’autre côté."},
      {"title": "Population et villes", "text": "La densité rapporte la population à la superficie. L’urbanisation désigne la croissance de la part de la population vivant en ville.", "questions": [{"id": "1-2-0", "prompt": "Quelle unité mesure une densité de population ?", "choices": ["Habitants par km²", "Habitants par an", "Kilomètres par habitant"], "explanation": "On divise le nombre d’habitants par la superficie en km²."}, {"id": "1-2-1", "prompt": "Une ville de 100 000 habitants couvre 50 km². Quelle est sa densité ?", "choices": ["2 000 hab./km²", "500 hab./km²", "5 000 hab./km²"], "explanation": "100 000 divisé par 50 vaut 2 000."}, {"id": "1-2-2", "prompt": "Comment reconnaître une urbanisation croissante ?", "choices": ["La part des habitants vivant en ville augmente", "Toutes les villes grandissent", "Le nombre total d’habitants diminue"], "explanation": "C’est la part des citadins qui compte."}], "example": "Deux villes de 60 000 habitants peuvent avoir des densités très différentes. Sur 30 km², la densité est de 2 000 hab./km². Sur 60 km², elle est deux fois moindre."},
      {"title": "Lire une carte", "text": "L’échelle compare les distances de la carte aux distances réelles. À 1:100 000, 1 cm représente 100 000 cm, soit 1 km.", "example": "Deux villages séparés de 4 cm sur cette carte sont distants de 4 km à vol d’oiseau.", "questions": [{"id": "1-3-0", "prompt": "À 1:100 000, combien représentent 2 cm ?", "choices": ["2 km", "200 m", "20 km"], "explanation": "Chaque centimètre représente un kilomètre."}, {"id": "1-3-1", "prompt": "À quoi sert la légende ?", "choices": ["À expliquer les symboles", "À indiquer l’âge du papier", "À mesurer la pluie"], "explanation": "Elle associe couleurs et signes à leur signification."}, {"id": "1-3-2", "prompt": "Pourquoi une route peut-elle être plus longue que la distance mesurée en ligne droite ?", "choices": ["Elle contourne des obstacles", "L’échelle dépend de la vitesse", "Les kilomètres disparaissent en ville"], "explanation": "Les détours augmentent la distance parcourue."}]},

  ]},
  {"name": "Sciences de la vie", "icon": "✿", "lessons": [
      {"title": "Cellules", "text": "La cellule est l’unité de base du vivant. Chez les animaux et les plantes, le noyau renferme la majeure partie de l’ADN.", "questions": [{"id": "2-0-0", "prompt": "Quel est le rôle principal de l’ADN ?", "choices": ["Porter l’information génétique", "Transporter l’oxygène dans le sang", "Digérer les protéines"], "explanation": "La séquence de l’ADN encode l’information génétique."}, {"id": "2-0-1", "prompt": "Où se trouve l’essentiel de l’ADN d’une cellule humaine qui possède un noyau ?", "choices": ["Dans le noyau", "Dans la membrane", "À l’extérieur de la cellule"], "explanation": "Les chromosomes sont contenus dans le noyau."}, {"id": "2-0-2", "prompt": "Quel organite permet la photosynthèse dans les cellules végétales ?", "choices": ["Le chloroplaste", "Le noyau", "Le ribosome"], "explanation": "Les chloroplastes captent l’énergie lumineuse grâce à la chlorophylle."}], "example": "Dans une feuille, les chloroplastes captent la lumière. Le noyau joue un autre rôle en abritant l’essentiel du matériel génétique de la cellule."},
      {"title": "Évolution", "text": "La sélection naturelle favorise, dans un milieu donné, la transmission de caractères héréditaires qui améliorent le succès reproducteur.", "questions": [{"id": "2-1-0", "prompt": "Qu’étudie la théorie de l’évolution ?", "choices": ["Le changement des populations au fil des générations", "La croissance d’un individu", "Le mouvement des planètes"], "explanation": "Les caractères héréditaires peuvent devenir plus ou moins fréquents."}, {"id": "2-1-1", "prompt": "Qui est associé à la théorie de la sélection naturelle ?", "choices": ["Charles Darwin", "Louis Pasteur", "Gregor Mendel"], "explanation": "Darwin et Alfred Russel Wallace ont formulé ce mécanisme."}, {"id": "2-1-2", "prompt": "Pourquoi une population bactérienne peut-elle devenir résistante après un traitement ?", "choices": ["Les bactéries résistantes survivent et se multiplient", "Toutes les bactéries décident de s’adapter", "Le médicament choisit de protéger les bactéries"], "explanation": "Le traitement exerce une pression de sélection."}], "example": "Si quelques insectes résistent déjà à un pesticide, ils survivent plus souvent au traitement. Leur descendance peut rendre la résistance plus fréquente dans la population."},
      {"title": "Écosystèmes", "text": "Les producteurs transforment l’énergie lumineuse ou chimique en matière organique. Les décomposeurs recyclent la matière.", "questions": [{"id": "2-2-0", "prompt": "Quel organisme est un producteur primaire ?", "choices": ["Une algue photosynthétique", "Un renard", "Une chouette"], "explanation": "L’algue fabrique de la matière organique grâce à la lumière."}, {"id": "2-2-1", "prompt": "Quel est le rôle des décomposeurs ?", "choices": ["Recycler la matière organique", "Produire la lumière solaire", "Empêcher la respiration"], "explanation": "Ils transforment les restes d’organismes et libèrent des nutriments."}, {"id": "2-2-2", "prompt": "Si une ressource alimentaire chute brutalement, quel effet direct peut toucher ses consommateurs ?", "choices": ["Une baisse de leur survie ou de leur reproduction", "Une augmentation garantie de leur population", "Une disparition de toute concurrence"], "explanation": "Une ressource rare peut limiter la croissance de la population."}], "example": "Dans une mare, les algues produisent de la matière organique. Quand elles meurent, des micro-organismes en dégradent les restes et rendent des nutriments à nouveau disponibles."},
      {"title": "Circulation du sang", "text": "Le cœur propulse le sang. Les artères partent du cœur, les veines y reviennent et les capillaires permettent des échanges avec les tissus.", "example": "L’artère pulmonaire transporte du sang vers les poumons, où il se charge en oxygène.", "questions": [{"id": "2-3-0", "prompt": "Dans quel sens une artère transporte-t-elle le sang ?", "choices": ["En s’éloignant du cœur", "En revenant vers le cœur", "Uniquement vers les pieds"], "explanation": "Le nom dépend du sens de circulation."}, {"id": "2-3-1", "prompt": "Où se font les échanges avec les tissus ?", "choices": ["Dans les capillaires", "Dans les os seuls", "Dans les valves cardiaques"], "explanation": "Leurs parois fines facilitent les échanges."}, {"id": "2-3-2", "prompt": "Quel organe charge le sang en oxygène ?", "choices": ["Les poumons", "L’estomac", "La vessie"], "explanation": "Les échanges ont lieu au niveau des alvéoles pulmonaires."}]},
      {"title": "Pollinisation", "text": "La pollinisation transfère le pollen vers le stigmate d’une fleur chez les plantes à fleurs. Elle peut permettre la fécondation et la formation de graines.", "example": "En visitant plusieurs fleurs de pommier, un insecte peut déposer du pollen d’un arbre sur les fleurs d’un autre.", "questions": [{"id": "2-4-0", "prompt": "Que transporte un pollinisateur ?", "choices": ["Du pollen", "Des racines", "Des fruits mûrs"], "explanation": "Le pollen peut adhérer à son corps."}, {"id": "2-4-1", "prompt": "Quel agent peut aussi transporter le pollen ?", "choices": ["Le vent", "Les ombres", "La gravité lunaire seule"], "explanation": "Le vent transporte le pollen de nombreuses plantes, dont les graminées."}, {"id": "2-4-2", "prompt": "Quelle structure peut se former après fécondation d’un ovule ?", "choices": ["Une graine", "Un pétale déjà ouvert", "Une tige de la plante mère"], "explanation": "L’ovule fécondé se développe en graine."}]},
      {"title": "Microbes et fermentation", "text": "Des micro-organismes transforment des substances. Certaines levures utilisent des sucres et peuvent produire du dioxyde de carbone et de l’éthanol par fermentation.", "example": "Dans une pâte à pain, le gaz produit forme des bulles qui font gonfler la pâte.", "questions": [{"id": "2-5-0", "prompt": "Quel gaz contribue à faire lever le pain ?", "choices": ["Le dioxyde de carbone", "L’hélium", "Le dioxygène"], "explanation": "Les bulles sont retenues dans la pâte."}, {"id": "2-5-1", "prompt": "Sur quoi les levures agissent-elles dans cet exemple ?", "choices": ["Des sucres", "Du verre", "Du sel pur"], "explanation": "Les sucres fournissent des ressources à leur métabolisme."}, {"id": "2-5-2", "prompt": "Quels microbes jouent le rôle principal dans la fabrication du yaourt ?", "choices": ["Des bactéries lactiques", "Des virus", "Des algues marines"], "explanation": "Elles produisent de l’acide lactique à partir du lactose."}]}
  ]},
  {"name": "Physique et chimie", "icon": "⚛", "lessons": [
      {"title": "Mouvement", "text": "La vitesse moyenne est la distance totale divisée par la durée totale. Une accélération traduit une variation de la vitesse ou de sa direction.", "questions": [{"id": "3-0-0", "prompt": "Quelle est l’unité de vitesse du Système international ?", "choices": ["m/s", "m²", "kg"], "explanation": "Une vitesse s’exprime en distance par unité de temps."}, {"id": "3-0-1", "prompt": "Quelle est la vitesse moyenne sur 120 km parcourus en 2 heures ?", "choices": ["60 km/h", "240 km/h", "30 km/h"], "explanation": "On divise 120 km par 2 h."}, {"id": "3-0-2", "prompt": "Un mobile prend un virage à vitesse de valeur constante. Accélère-t-il ?", "choices": ["Oui, la direction change", "Non, car la valeur est constante", "Uniquement s’il freine"], "explanation": "La vitesse est un vecteur. Changer sa direction suffit à créer une accélération."}], "example": "Un cycliste parcourt 30 km en 2 h. Sa vitesse moyenne vaut 15 km/h, même si sa vitesse réelle varie selon les montées et les descentes."},
      {"title": "Matière", "text": "Les atomes peuvent former des molécules. Un changement d’état conserve l’identité chimique des substances.", "questions": [{"id": "3-1-0", "prompt": "Quel symbole désigne l’oxygène ?", "choices": ["O", "Ox", "Og"], "explanation": "O est le symbole de l’élément oxygène."}, {"id": "3-1-1", "prompt": "Combien d’atomes contient une molécule d’eau ?", "choices": ["Trois", "Deux", "Quatre"], "explanation": "H₂O contient deux atomes d’hydrogène et un d’oxygène."}, {"id": "3-1-2", "prompt": "Pourquoi la fusion de la glace est-elle un changement physique ?", "choices": ["Les molécules restent des molécules d’eau", "L’hydrogène se sépare de l’oxygène", "L’eau se transforme en un autre composé"], "explanation": "La structure change mais la composition chimique reste H₂O."}], "example": "Un glaçon fond puis l’eau s’évapore. À chaque étape, les molécules restent H₂O. C’est leur organisation et leur mouvement qui changent."},
      {"title": "Énergie", "text": "L’énergie peut être transférée ou transformée. Dans un système isolé, l’énergie totale se conserve.", "questions": [{"id": "3-2-0", "prompt": "Quelle unité mesure une énergie dans le Système international ?", "choices": ["Le joule", "Le watt", "Le newton"], "explanation": "Le watt mesure une puissance et le newton une force."}, {"id": "3-2-1", "prompt": "Quel dispositif convertit la lumière en électricité ?", "choices": ["Une cellule photovoltaïque", "Une résistance chauffante", "Une pile non rechargeable"], "explanation": "Les cellules photovoltaïques exploitent l’énergie lumineuse."}, {"id": "3-2-2", "prompt": "Que devient une partie de l’énergie mécanique d’un vélo qui freine ?", "choices": ["Elle se transforme en énergie thermique", "Elle disparaît", "Elle se transforme en masse du vélo"], "explanation": "Les frottements échauffent le système de freinage."}], "example": "Dans une descente, le vélo prend de la vitesse. Lors du freinage, les patins ou les disques s’échauffent, car une partie de l’énergie mécanique est transformée en chaleur."},
      {"title": "Lumière et ombres", "text": "Dans un milieu homogène, la lumière se propage en ligne droite. Un objet opaque intercepte une partie des rayons et crée une ombre.", "example": "Une main rapprochée d’une petite lampe projette souvent une ombre plus grande sur le mur.", "questions": [{"id": "3-3-0", "prompt": "Qu’est-ce qu’un matériau opaque ?", "choices": ["Un matériau qui bloque la transmission de la lumière visible", "Un matériau qui émet toujours de la lumière", "Un matériau invisible"], "explanation": "Les rayons ne traversent pas l’objet opaque."}, {"id": "3-3-1", "prompt": "Pourquoi voit-on une zone sombre derrière l’objet ?", "choices": ["La lumière directe est interceptée", "L’objet détruit l’écran", "L’air devient solide"], "explanation": "La zone sombre reçoit moins de lumière de la source."}, {"id": "3-3-2", "prompt": "Que fait un miroir plan à un rayon lumineux ?", "choices": ["Il le réfléchit", "Il le transforme en son", "Il le rend immobile"], "explanation": "Le rayon change de direction par réflexion."}]},
      {"title": "Circuits électriques", "text": "Pour qu’un courant circule dans un circuit simple alimenté par une pile, il faut une boucle conductrice fermée. Un interrupteur peut ouvrir la boucle.", "example": "Avec deux lampes en série, retirer une lampe ouvre la boucle et éteint aussi l’autre.", "questions": [{"id": "3-4-0", "prompt": "Que fait un interrupteur ouvert ?", "choices": ["Il coupe la boucle", "Il double la tension de la pile", "Il change les fils en isolants"], "explanation": "Il interrompt le chemin du courant."}, {"id": "3-4-1", "prompt": "Quel matériau conduit bien l’électricité ?", "choices": ["Le cuivre", "Le caoutchouc sec", "Le verre sec"], "explanation": "Le cuivre est utilisé dans de nombreux fils."}, {"id": "3-4-2", "prompt": "Deux lampes sont branchées en série. L’une est retirée. Que fait l’autre ?", "choices": ["Elle s’éteint", "Elle clignote toujours", "Elle reste forcément allumée"], "explanation": "La seule boucle est interrompue."}]},
      {"title": "Mélanges et solutions", "text": "Dissoudre signifie disperser un soluté dans un solvant jusqu’à obtenir un mélange homogène. Une solution salée contient toujours le sel dissous.", "example": "En laissant l’eau d’une coupelle s’évaporer, on peut retrouver des cristaux de sel.", "questions": [{"id": "3-5-0", "prompt": "Quel est le solvant dans de l’eau salée ?", "choices": ["L’eau", "Le sel", "Le récipient"], "explanation": "L’eau est le liquide qui dissout le sel."}, {"id": "3-5-1", "prompt": "Quel procédé récupère le sel dissous ?", "choices": ["L’évaporation de l’eau", "Le tamisage ordinaire", "Un aimant"], "explanation": "Le sel reste quand l’eau s’évapore."}, {"id": "3-5-2", "prompt": "Pourquoi un filtre à café laisse-t-il passer le sel dissous ?", "choices": ["Le sel est dispersé sous forme d’ions", "Le filtre transforme le sel en sucre", "Le sel a disparu définitivement"], "explanation": "Un filtre ordinaire retient surtout des particules assez grandes."}]}
  ]},
  {"name": "Mathématiques", "icon": "∑", "lessons": [
      {"title": "Proportions", "text": "Un pourcentage exprime une fraction sur 100. Une variation relative se calcule par rapport à la valeur de départ.", "questions": [{"id": "4-0-0", "prompt": "Combien valent 25 % de 80 ?", "choices": ["20", "25", "40"], "explanation": "25 % est un quart et 80 divisé par 4 vaut 20."}, {"id": "4-0-1", "prompt": "Quel coefficient correspond à une hausse de 15 % ?", "choices": ["1,15", "0,15", "0,85"], "explanation": "On conserve 100 % puis on ajoute 15 %."}, {"id": "4-0-2", "prompt": "Après +20 % puis −20 %, que devient un prix de 100 € ?", "choices": ["96 €", "100 €", "80 €"], "explanation": "Le second pourcentage porte sur 120 €. Le produit 1,2 × 0,8 vaut 0,96."}], "example": "Sur un prix de 50 €, une hausse de 10 % donne 55 €. Une baisse de 10 % s’applique ensuite à 55 € et ramène le prix à 49,50 €."},
      {"title": "Géométrie", "text": "L’aire d’un rectangle est le produit de ses côtés. Le théorème de Pythagore relie les trois longueurs d’un triangle rectangle.", "questions": [{"id": "4-1-0", "prompt": "Quelle est l’aire d’un rectangle de 6 cm par 4 cm ?", "choices": ["24 cm²", "20 cm²", "10 cm²"], "explanation": "On multiplie 6 par 4."}, {"id": "4-1-1", "prompt": "Dans un triangle rectangle, comment appelle-t-on le côté opposé à l’angle droit ?", "choices": ["L’hypoténuse", "La médiane", "La hauteur"], "explanation": "C’est le côté le plus long."}, {"id": "4-1-2", "prompt": "Les deux petits côtés d’un triangle rectangle font 5 et 12 cm. Quelle est son hypoténuse ?", "choices": ["13 cm", "17 cm", "√119 cm"], "explanation": "5² + 12² = 169 et √169 = 13."}], "example": "Un rectangle de 3 m sur 4 m a une aire de 12 m². Sa diagonale mesure 5 m, car le carré de sa longueur vaut 3² + 4² = 25."},
      {"title": "Probabilités", "text": "Une probabilité est comprise entre 0 et 1. Pour des essais indépendants, on multiplie les probabilités des événements que l’on veut voir se produire ensemble.", "questions": [{"id": "4-2-0", "prompt": "Quelle est la probabilité d’obtenir un 6 avec un dé équilibré à six faces ?", "choices": ["1/6", "1/2", "1/36"], "explanation": "Un seul résultat favorable sur six résultats équiprobables."}, {"id": "4-2-1", "prompt": "Que vaut la probabilité d’un événement certain ?", "choices": ["1", "0", "1/2"], "explanation": "Un événement certain se produit dans tous les cas."}, {"id": "4-2-2", "prompt": "Deux pièces équilibrées sont lancées indépendamment. Quelle est la probabilité de deux piles ?", "choices": ["1/4", "1/2", "3/4"], "explanation": "On multiplie 1/2 par 1/2."}], "example": "Deux lancers de pièce donnent quatre suites équiprobables. Parmi pile-pile, pile-face, face-pile et face-face, une seule contient deux faces."},
      {"title": "Moyenne et médiane", "text": "La moyenne divise la somme par le nombre de valeurs. La médiane se lit au centre d’une série ordonnée et résiste mieux à certaines valeurs extrêmes.", "example": "Pour 2, 3 et 25, la médiane vaut 3 tandis que la moyenne vaut 10.", "questions": [{"id": "4-3-0", "prompt": "Quelle est la médiane de 1, 4 et 10 ?", "choices": ["4", "5", "10"], "explanation": "C’est la valeur centrale après classement."}, {"id": "4-3-1", "prompt": "Quelle est la moyenne de 3, 6 et 12 ?", "choices": ["7", "6", "9"], "explanation": "La somme 21 est divisée par 3."}, {"id": "4-3-2", "prompt": "Quelle mesure varie le moins si 25 devient 250 dans la série 2, 3, 25 ?", "choices": ["La médiane", "La moyenne", "L’étendue"], "explanation": "La valeur centrale reste 3."}]},
      {"title": "Équations du premier degré", "text": "Résoudre une équation revient à trouver la valeur qui rend l’égalité vraie. Faire la même opération réversible aux deux membres conserve les solutions.", "example": "Dans 3x + 5 = 17, on retranche 5 des deux côtés, puis on divise les deux côtés par 3. On obtient x = 4.", "questions": [{"id": "4-4-0", "prompt": "Que vaut x dans x + 7 = 12 ?", "choices": ["5", "19", "−5"], "explanation": "On soustrait 7 des deux côtés."}, {"id": "4-4-1", "prompt": "Que vaut x dans 4x = 28 ?", "choices": ["7", "24", "32"], "explanation": "On divise chaque membre par 4."}, {"id": "4-4-2", "prompt": "Quel calcul vérifie que x = 3 résout 2x + 1 = 7 ?", "choices": ["2 × 3 + 1 = 7", "2 + 3 + 1 = 7", "2 × 3 − 1 = 7"], "explanation": "On remplace x par 3 dans l’égalité initiale."}]},
      {"title": "Croissance linéaire et multiplicative", "text": "Une croissance additive ajoute la même quantité à chaque étape. Une croissance multiplicative applique le même facteur.", "example": "Avec 100 au départ, ajouter 10 donne 100, 110, 120. Augmenter de 10 % donne 100, 110, 121.", "questions": [{"id": "4-5-0", "prompt": "Quel terme suit 5, 8, 11 si le pas reste constant ?", "choices": ["14", "13", "16"], "explanation": "Le pas vaut 3."}, {"id": "4-5-1", "prompt": "Quel terme suit 3, 6, 12 si le facteur reste constant ?", "choices": ["24", "18", "15"], "explanation": "Chaque terme double."}, {"id": "4-5-2", "prompt": "Pourquoi deux hausses de 10 % donnent-elles 21 % de hausse au total ?", "choices": ["La deuxième hausse porte sur une base déjà augmentée", "Le taux devient automatiquement 11 %", "Les deux hausses se compensent"], "explanation": "Les coefficients se multiplient, 1,1 × 1,1 = 1,21."}]}
  ]},
  {"name": "Arts et littérature", "icon": "✦", "lessons": [
      {"title": "Peinture", "text": "La perspective donne une impression de profondeur. À la fin du XIXe siècle, les impressionnistes étudient notamment les variations de lumière.", "questions": [{"id": "5-0-0", "prompt": "Qui a peint La Joconde ?", "choices": ["Léonard de Vinci", "Claude Monet", "Pablo Picasso"], "explanation": "Léonard de Vinci a peint ce portrait conservé au Louvre."}, {"id": "5-0-1", "prompt": "Quel peintre a réalisé Impression, soleil levant ?", "choices": ["Claude Monet", "Édouard Manet", "Paul Cézanne"], "explanation": "Le titre du tableau a donné son nom à l’impressionnisme."}, {"id": "5-0-2", "prompt": "Quel effet produit un point de fuite en perspective ?", "choices": ["Il crée une impression de profondeur", "Il change le sujet représenté", "Il agrandit physiquement la toile"], "explanation": "Les parallèles représentées qui s’éloignent convergent visuellement."}], "example": "Sur un dessin de rue, les lignes des trottoirs semblent se rejoindre au loin. Cette convergence vers un point de fuite donne de la profondeur à l’image."},
      {"title": "Roman", "text": "Le narrateur est la voix qui raconte. Un récit peut limiter les informations à ce qu’un personnage sait, voit ou pense.", "questions": [{"id": "5-1-0", "prompt": "Qui a écrit Les Misérables ?", "choices": ["Victor Hugo", "Honoré de Balzac", "Émile Zola"], "explanation": "Le roman de Victor Hugo paraît en 1862."}, {"id": "5-1-1", "prompt": "Qui a écrit Les Lusiades ?", "choices": ["Luís de Camões", "Fernando Pessoa", "José Saramago"], "explanation": "Cette épopée de Camões paraît en 1572."}, {"id": "5-1-2", "prompt": "Dans quel cas a-t-on un point de vue interne ?", "choices": ["Le récit se limite à ce qu’un personnage perçoit", "Le narrateur connaît les pensées de tous", "Le récit montre uniquement les gestes vus de l’extérieur"], "explanation": "Le point de vue interne filtre le récit par un personnage."}], "example": "« Elle entendit un bruit derrière la porte et s’immobilisa. » Le lecteur partage l’incertitude du personnage si le narrateur ne révèle pas l’origine du bruit."},
      {"title": "Musique", "text": "Le tempo est la vitesse de la pulsation. En musique occidentale, la hauteur d’un son dépend de sa fréquence.", "questions": [{"id": "5-2-0", "prompt": "Que mesure le tempo ?", "choices": ["La vitesse de la pulsation", "La hauteur des notes", "Le nombre d’instruments"], "explanation": "On l’indique souvent en battements par minute."}, {"id": "5-2-1", "prompt": "Quel instrument accompagne traditionnellement le fado ?", "choices": ["La guitare portugaise", "Le clavecin", "Le cor des Alpes"], "explanation": "La guitare portugaise à douze cordes est emblématique du fado."}, {"id": "5-2-2", "prompt": "Si la fréquence d’un son double, de quel intervalle monte-t-il ?", "choices": ["Une octave", "Une quinte", "Un demi-ton"], "explanation": "Deux sons dans un rapport de fréquence de 2 à 1 sont à une octave."}], "example": "Un la à 440 Hz et un la à 880 Hz sont séparés d’une octave. On peut jouer ces notes lentement ou vite, car la hauteur et le tempo sont indépendants."},
      {"title": "Architecture gothique", "text": "Les arcs brisés et les voûtes sur croisées d’ogives comptent parmi les formes caractéristiques du gothique. Dans de grandes églises, les arcs-boutants aident à reprendre la poussée des voûtes.", "example": "À Chartres, les supports extérieurs contribuent à rendre possibles de grandes ouvertures pour les vitraux.", "questions": [{"id": "5-3-0", "prompt": "Quel élément reprend une poussée depuis l’extérieur ?", "choices": ["L’arc-boutant", "La rosace", "Le vitrail"], "explanation": "Il transmet une partie de la poussée vers un support extérieur."}, {"id": "5-3-1", "prompt": "Quelle ouverture colorée laisse passer la lumière ?", "choices": ["Le vitrail", "Le contrefort plein", "La voûte aveugle"], "explanation": "Les pièces de verre composent des motifs éclairés."}, {"id": "5-3-2", "prompt": "Quel profil d’arc est caractéristique du gothique ?", "choices": ["L’arc brisé", "Un linteau horizontal", "Un cercle fermé"], "explanation": "Ses deux courbes se rejoignent en pointe."}]},
      {"title": "Poésie et figures", "text": "Une comparaison rapproche deux éléments avec un outil comme « comme ». Une métaphore fait le rapprochement sans outil comparatif explicite.", "example": "« Le lac est un miroir » suggère une eau lisse et réfléchissante par métaphore.", "questions": [{"id": "5-4-0", "prompt": "Quelle formule est une comparaison ?", "choices": ["Il court comme le vent", "La ville s’éveille", "Cette idée est une graine"], "explanation": "Le mot « comme » signale le rapprochement."}, {"id": "5-4-1", "prompt": "Quelle formule contient une métaphore ?", "choices": ["Cette voix est du velours", "Cette voix est douce comme le velours", "Cette voix parle bas"], "explanation": "Le velours désigne ici la douceur d’un timbre."}, {"id": "5-4-2", "prompt": "Qu’est-ce qu’un vers ?", "choices": ["Une unité d’un poème disposée sur une ligne", "Un personnage du récit", "Une rime obligatoire"], "explanation": "Un vers peut se terminer sans rimer."}]},
      {"title": "Montage au cinéma", "text": "Le montage organise la succession des plans. Une ellipse retire une portion de l’action, que le public peut reconstruire.", "example": "On voit une personne préparer sa valise, puis sortir d’un train. Le voyage est compris même si on ne le voit pas.", "questions": [{"id": "5-5-0", "prompt": "Que supprime une ellipse ?", "choices": ["Une durée ou un événement dans le récit montré", "La couleur d’un acteur", "Le générique seulement"], "explanation": "Le spectateur relie les moments montrés."}, {"id": "5-5-1", "prompt": "Que montre un gros plan de visage ?", "choices": ["Un détail du visage ou une expression", "Toute la ville autour du personnage", "Uniquement le décor lointain"], "explanation": "Le cadrage rapproché concentre le regard."}, {"id": "5-5-2", "prompt": "Que rapproche le champ-contrechamp lors d’un dialogue ?", "choices": ["Les points de vue alternés sur les interlocuteurs", "Deux bandes son identiques", "Des génériques successifs"], "explanation": "L’alternance construit l’échange."}]}

  {"name": "Philosophie", "icon": "◈", "lessons": [
      {"title": "Raison et doute", "text": "La philosophie examine les raisons qui soutiennent nos jugements. Le doute méthodique de Descartes cherche un point de départ résistant au doute.", "questions": [{"id": "6-0-0", "prompt": "Quel philosophe est associé à « Je pense, donc je suis » ?", "choices": ["René Descartes", "Jean-Jacques Rousseau", "Karl Marx"], "explanation": "Descartes présente cette formule dans le Discours de la méthode."}, {"id": "6-0-1", "prompt": "Qu’est-ce qu’une prémisse ?", "choices": ["Une proposition qui soutient une conclusion", "Une conclusion nécessairement vraie", "Un exemple qui réfute une idée"], "explanation": "Un raisonnement s’appuie sur une ou plusieurs prémisses."}, {"id": "6-0-2", "prompt": "Quel est le but du doute méthodique cartésien ?", "choices": ["Trouver une certitude première", "Douter pour toujours", "Refuser toute démonstration"], "explanation": "Le doute est un moyen d’éprouver les croyances."}], "example": "Descartes envisage qu’une perception puisse être un rêve. Le fait même qu’il doute lui fournit néanmoins une certitude immédiate, celle de son existence comme être qui pense."},
      {"title": "Éthique", "text": "L’éthique réfléchit à la manière d’agir. Certaines approches privilégient le devoir et d’autres les conséquences de l’action.", "questions": [{"id": "6-1-0", "prompt": "Quelle question relève de l’éthique ?", "choices": ["Que devons-nous faire ?", "Quelle est la masse de la Terre ?", "Comment accorder ce verbe ?"], "explanation": "L’éthique examine les raisons qui guident nos actes."}, {"id": "6-1-1", "prompt": "Que privilégie une approche conséquentialiste ?", "choices": ["Les effets d’une action", "L’ancienneté d’une règle", "Le rang social de son auteur"], "explanation": "Elle juge l’action au regard de ses conséquences."}, {"id": "6-1-2", "prompt": "Quelle approche juge un acte à partir des devoirs qu’il respecte ?", "choices": ["La déontologie", "Le scepticisme", "L’esthétique"], "explanation": "Une éthique déontologique insiste sur les obligations morales."}], "example": "Pour juger un mensonge destiné à protéger quelqu’un, on peut examiner ses conséquences ou se demander si mentir enfreint un devoir. Ces deux critères peuvent mener à des jugements différents."},
      {"title": "Politique", "text": "La philosophie politique s’interroge sur la légitimité du pouvoir, la liberté et la justice.", "questions": [{"id": "6-2-0", "prompt": "Qui a écrit Du contrat social ?", "choices": ["Jean-Jacques Rousseau", "Voltaire", "Simone de Beauvoir"], "explanation": "L’ouvrage de Rousseau paraît en 1762."}, {"id": "6-2-1", "prompt": "Qu’étudie la philosophie politique lorsqu’elle interroge la légitimité ?", "choices": ["Les raisons qui justifient l’exercice du pouvoir", "La vitesse des élections", "Le nombre de bâtiments publics"], "explanation": "La légitimité concerne le droit reconnu à gouverner."}, {"id": "6-2-2", "prompt": "À quoi sert la séparation des pouvoirs ?", "choices": ["Limiter la concentration du pouvoir", "Confier toutes les décisions à un organe", "Supprimer les lois"], "explanation": "La distribution des fonctions permet des contre-pouvoirs."}], "example": "Le Parlement vote une loi et un tribunal peut contrôler son application dans un litige. La distinction des fonctions limite la concentration du pouvoir."},
      {"title": "Validité d’un raisonnement", "text": "Un raisonnement déductif est valide si ses prémisses, supposées vraies, rendent sa conclusion nécessaire. La vérité des prémisses se vérifie à part.", "example": "« Tous les chats volent. Félix est un chat. Donc Félix vole. » La forme est valide, mais la première prémisse est fausse.", "questions": [{"id": "6-3-0", "prompt": "Que garantit la validité d’une déduction ?", "choices": ["Si les prémisses sont vraies, la conclusion est vraie", "Toutes ses prémisses sont forcément vraies", "Sa conclusion est toujours fausse"], "explanation": "Elle porte sur le lien entre prémisses et conclusion."}, {"id": "6-3-1", "prompt": "Quel terme nomme ce que le raisonnement veut établir ?", "choices": ["La conclusion", "La prémisse", "Le contre-exemple"], "explanation": "La conclusion est ce qu’on tire des prémisses."}, {"id": "6-3-2", "prompt": "« Tous les A sont B. X est A. » Qu’en déduit-on ?", "choices": ["X est B", "X n’est pas B", "Tous les B sont A"], "explanation": "L’appartenance à A entraîne celle à B."}]},
      {"title": "Liberté et contraintes", "text": "On peut distinguer la liberté de choisir selon ses propres raisons et la possibilité concrète d’agir. Une contrainte extérieure peut limiter cette seconde liberté.", "example": "Une personne souhaite voyager et dispose des moyens de partir, mais une route fermée l’oblige à modifier son itinéraire.", "questions": [{"id": "6-4-0", "prompt": "Quel élément relève d’une contrainte extérieure ?", "choices": ["Une route barrée", "Une préférence pour le train", "Un souvenir de vacances"], "explanation": "La fermeture ne dépend pas de la volonté du voyageur."}, {"id": "6-4-1", "prompt": "Que signifie agir sous la contrainte ?", "choices": ["Agir dans une situation où les options sont imposées ou réduites", "Agir toujours par goût personnel", "Agir sans aucune limite"], "explanation": "Une contrainte réduit le champ des actions possibles."}, {"id": "6-4-2", "prompt": "Pourquoi deux personnes qui souhaitent le même voyage peuvent-elles avoir des possibilités différentes ?", "choices": ["Elles peuvent disposer de moyens différents", "Un souhait produit toujours les mêmes possibilités", "Les circonstances ne jouent aucun rôle"], "explanation": "Les moyens matériels affectent la capacité réelle d’agir."}]},
      {"title": "Preuve et témoignage", "text": "Un témoignage peut justifier une croyance. Sa valeur dépend notamment de la proximité du témoin avec les faits, de sa fiabilité et de la corroboration indépendante.", "example": "Deux personnes qui répètent la même rumeur ne constituent pas deux observations indépendantes.", "questions": [{"id": "6-5-0", "prompt": "Que signifie corroborer un témoignage ?", "choices": ["Le recouper par d’autres éléments", "Le supprimer", "Le répéter mot pour mot"], "explanation": "On cherche un appui distinct au récit."}, {"id": "6-5-1", "prompt": "Pourquoi l’indépendance des sources compte-t-elle ?", "choices": ["Plusieurs récits peuvent remonter à une seule erreur", "Le nombre de mots fixe la vérité", "La première source est toujours juste"], "explanation": "Des sources dépendantes peuvent propager la même erreur."}, {"id": "6-5-2", "prompt": "Qu’est-ce qu’une observation de première main ?", "choices": ["Une observation faite par la personne qui témoigne", "Un récit entendu trois fois", "Une supposition sur l’avenir"], "explanation": "Le témoin a directement observé le fait rapporté."}]}
  ]},
  {"name": "Économie et société", "icon": "◇", "lessons": [
      {"title": "Échanges et prix", "text": "Les prix résultent notamment de la rencontre entre offre et demande. L’inflation correspond à une hausse générale des prix.", "questions": [{"id": "7-0-0", "prompt": "Que désigne l’inflation ?", "choices": ["Une hausse générale des prix", "Une hausse du prix d’un seul bien", "Une baisse générale des prix"], "explanation": "L’inflation se mesure à partir d’un ensemble de biens et de services."}, {"id": "7-0-1", "prompt": "À offre inchangée, quel effet une hausse de la demande exerce-t-elle généralement sur le prix ?", "choices": ["Une pression à la hausse", "Une pression à la baisse", "Aucun effet possible"], "explanation": "Les acheteurs se disputent une offre identique."}, {"id": "7-0-2", "prompt": "Si les prix augmentent et que le revenu reste fixe, qu’arrive-t-il au pouvoir d’achat ?", "choices": ["Il diminue", "Il augmente", "Il reste toujours identique"], "explanation": "Le même revenu permet d’acheter moins de biens et services."}], "example": "Avec 20 €, on achetait dix articles à 2 €. Si chacun passe à 2,50 €, le même budget permet d’en acheter huit. Le pouvoir d’achat baisse pour ces articles."},

      {"title": "Travail et production", "text": "La productivité rapporte la production aux ressources utilisées. Le PIB mesure la valeur de la production finale réalisée sur un territoire pendant une période.", "questions": [{"id": "7-2-0", "prompt": "Que signifie PIB ?", "choices": ["Produit intérieur brut", "Prix international de base", "Patrimoine immobilier brut"], "explanation": "Le PIB concerne la production réalisée sur un territoire."}, {"id": "7-2-1", "prompt": "Quel rapport mesure la productivité horaire du travail ?", "choices": ["Production divisée par heures travaillées", "Heures divisées par population", "Salaire divisé par prix"], "explanation": "On mesure la quantité ou la valeur produite par heure de travail."}, {"id": "7-2-2", "prompt": "La production double et les heures travaillées doublent. Que devient la productivité horaire ?", "choices": ["Elle reste identique", "Elle double", "Elle est divisée par deux"], "explanation": "Le numérateur et le dénominateur sont multipliés par deux."}], "example": "Un atelier produit 200 pièces en 40 heures, soit 5 par heure. Avec 240 pièces pour la même durée, sa productivité passe à 6 pièces par heure."},
      {"title": "Coût d’opportunité", "text": "Choisir un usage de son temps ou de son argent fait renoncer à une autre possibilité. Le coût d’opportunité est la valeur de la meilleure option écartée.", "example": "Vous choisissez de consacrer une heure à lire. Si votre meilleure autre option était une promenade, le bénéfice de cette promenade représente le coût d’opportunité.", "questions": [{"id": "7-3-0", "prompt": "Que mesure le coût d’opportunité ?", "choices": ["La valeur de la meilleure option écartée", "La somme de toutes les dépenses passées", "Le seul prix affiché"], "explanation": "Un choix peut avoir un coût même sans paiement."}, {"id": "7-3-1", "prompt": "Ce coût peut-il exister pour une activité gratuite ?", "choices": ["Oui, si elle mobilise une ressource comme le temps", "Non, il faut une facture", "Uniquement si elle se fait de nuit"], "explanation": "Le temps peut servir à une autre activité."}, {"id": "7-3-2", "prompt": "Si une salle sert à un concert, que peut-on compter comme coût d’opportunité ?", "choices": ["Le bénéfice de la meilleure autre utilisation possible", "La peinture utilisée dix ans plus tôt", "Le nombre total de chaises"], "explanation": "La salle ne peut être utilisée simultanément de la même façon pour le meilleur projet écarté."}]},
      {"title": "Biens publics", "text": "Un bien public au sens économique est non rival et difficilement excluable. Une personne peut en bénéficier sans réduire l’usage des autres, et empêcher certains usagers d’en bénéficier est difficile.", "example": "Dans une rue éclairée, plusieurs passants profitent en même temps de la lumière, sans contrôle d’accès.", "questions": [{"id": "7-4-0", "prompt": "Quel exemple se rapproche d’un bien public ?", "choices": ["L’éclairage d’une rue ouverte", "Un sandwich individuel", "Un siège numéroté occupé"], "explanation": "Plusieurs personnes profitent simultanément de l’éclairage."}, {"id": "7-4-1", "prompt": "Que signifie « non rival » ?", "choices": ["L’usage d’une personne ne réduit pas celui des autres", "Il faut obligatoirement payer une entrée", "Le bien ne sert qu’une seule fois"], "explanation": "Plusieurs utilisateurs peuvent en bénéficier simultanément."}, {"id": "7-4-2", "prompt": "Pourquoi un sandwich est-il rival ?", "choices": ["La part mangée par l’un ne peut plus être mangée par l’autre", "Il se vend avec un prix", "Il est fait de plusieurs ingrédients"], "explanation": "Sa consommation réduit la quantité disponible."}]},

s. Elle ruisselle ou s'infiltre dans les sols."},{"id":"extra-3-1","prompt":"Quel processus forme des gouttelettes depuis la vapeur ?","choices":["La condensation","La fusion","La combustion"],"explanation":"Réponse : La condensation. L'eau s'évapore, se condense, puis retombe sous forme de précipitations. Elle ruisselle ou s'infiltre dans les sols."},{"id":"extra-3-2","prompt":"Où peut se stocker l'eau infiltrée ?","choices":["Dans une nappe","Dans le noyau terrestre","Dans une étoile"],"explanation":"Réponse : Dans une nappe. L'eau s'évapore, se condense, puis retombe sous forme de précipitations. Elle ruisselle ou s'infiltre dans les sols."}]}},{"domain":2,"lesson":{"title":"Méthode scientifique","text":"Une hypothèse scientifique doit pouvoir être testée. Un groupe témoin permet de comparer des résultats et de limiter les biais.","example":"On compare des plantes similaires avec et sans engrais.","questions":[{"id":"extra-4-0","prompt":"À quoi sert un groupe témoin ?","choices":["À comparer les résultats","À garantir une hypothèse","À supprimer les mesures"],"explanation":"Réponse : À comparer les résultats. Une hypothèse scientifique doit pouvoir être testée. Un groupe témoin permet de comparer des résultats et de limiter les biais."},{"id":"extra-4-1","prompt":"Une hypothèse testable est-elle vérifiable par des observations ?","choices":["Oui","Non","Uniquement en philosophie"],"explanation":"Réponse : Oui. Une hypothèse scientifique doit pouvoir être testée. Un groupe témoin permet de comparer des résultats et de limiter les biais."},{"id":"extra-4-2","prompt":"Pourquoi répéter une expérience ?","choices":["Pour tester la reproductibilité","Pour changer les lois physiques","Pour éviter les contrôles"],"explanation":"Réponse : Pour tester la reproductibilité. Une hypothèse scientifique doit pouvoir être testée. Un groupe témoin permet de comparer des résultats et de limiter les biais."}]}},{"domain":2,"lesson":{"title":"ADN et hérédité","text":"L'ADN porte l'information génétique. Un gène est une région d'ADN et ses variantes sont des allèles.","example":"Un enfant reçoit du matériel génétique de chacun de ses parents.","questions":[{"id":"extra-5-0","prompt":"Qu'est-ce qu'un gène ?","choices":["Une région d'ADN","Un organe","Une cellule entière"],"explanation":"Réponse : Une région d'ADN. L'ADN porte l'information génétique. Un gène est une région d'ADN et ses variantes sont des allèles."},{"id":"extra-5-1","prompt":"Comment nomme-t-on les variantes d'un gène ?","choices":["Des allèles","Des neurones","Des hormones"],"explanation":"Réponse : Des allèles. L'ADN porte l'information génétique. Un gène est une région d'ADN et ses variantes sont des allèles."},{"id":"extra-5-2","prompt":"Où se trouve la majeure partie de l'ADN humain ?","choices":["Dans le noyau","Dans la membrane","À l'extérieur de la cellule"],"explanation":"Réponse : Dans le noyau. L'ADN porte l'information génétique. Un gène est une région d'ADN et ses variantes sont des allèles."}]}},{"domain":3,"lesson":{"title":"Perspective artistique","text":"La perspective linéaire utilise des lignes de fuite pour représenter la profondeur sur une surface plane.","example":"Les bords d'une route semblent se rejoindre à l'horizon.","questions":[{"id":"extra-6-0","prompt":"Que représente un point de fuite ?","choices":["Une direction en profondeur","La date du tableau","La signature du peintre"],"explanation":"Réponse : Une direction en profondeur. La perspective linéaire utilise des lignes de fuite pour représenter la profondeur sur une surface plane."},{"id":"extra-6-1","prompt":"Quand la perspective linéaire est-elle formalisée en Europe ?","choices":["À la Renaissance","Au Paléolithique","Au XXIe siècle"],"explanation":"Réponse : À la Renaissance. La perspective linéaire utilise des lignes de fuite pour représenter la profondeur sur une surface plane."},{"id":"extra-6-2","prompt":"Comment paraît un objet qui s'éloigne ?","choices":["Plus petit","Toujours plus grand","Toujours identique"],"explanation":"Réponse : Plus petit. La perspective linéaire utilise des lignes de fuite pour représenter la profondeur sur une surface plane."}]}},{"domain":3,"lesson":{"title":"Architecture gothique","text":"L'architecture gothique utilise notamment arcs brisés, voûtes d'ogives et arcs-boutants.","example":"Les arcs-boutants soutiennent les poussées latérales de certaines voûtes.","questions":[{"id":"extra-7-0","prompt":"Quel élément reprend les poussées latérales ?","choices":["L'arc-boutant","La mosaïque","La fresque"],"explanation":"Réponse : L'arc-boutant. L'architecture gothique utilise notamment arcs brisés, voûtes d'ogives et arcs-boutants."},{"id":"extra-7-1","prompt":"Quel arc est caractéristique du gothique ?","choices":["L'arc brisé","L'arc exclusivement circulaire","L'arc plat uniquement"],"explanation":"Réponse : L'arc brisé. L'architecture gothique utilise notamment arcs brisés, voûtes d'ogives et arcs-boutants."},{"id":"extra-7-2","prompt":"Qu'accueillent les grandes baies gothiques ?","choices":["Des vitraux","Des aqueducs","Des escaliers mécaniques"],"explanation":"Réponse : Des vitraux. L'architecture gothique utilise notamment arcs brisés, voûtes d'ogives et arcs-boutants."}]}},{"domain":4,"lesson":{"title":"Logique déductive","text":"Une déduction valide garantit la conclusion si les prémisses sont vraies. La validité n'implique pas que les prémisses soient effectivement vraies.","example":"Tous les mammifères respirent ; une baleine est un mammifère ; elle respire.","questions":[{"id":"extra-8-0","prompt":"Comment appelle-t-on une proposition de départ ?","choices":["Une prémisse","Une conclusion","Une métaphore"],"explanation":"Réponse : Une prémisse. Une déduction valide garantit la conclusion si les prémisses sont vraies. La validité n'implique pas que les prémisses soient effectivement vraies."},{"id":"extra-8-1","prompt":"Une déduction valide préserve-t-elle la vérité des prémisses ?","choices":["Oui","Non","Seulement en poésie"],"explanation":"Réponse : Oui. Une déduction valide garantit la conclusion si les prémisses sont vraies. La validité n'implique pas que les prémisses soient effectivement vraies."},{"id":"extra-8-2","prompt":"Un raisonnement valide peut-il avoir une prémisse fausse ?","choices":["Oui","Non","Seulement en géométrie"],"explanation":"Réponse : Oui. Une déduction valide garantit la conclusion si les prémisses sont vraies. La validité n'implique pas que les prémisses soient effectivement vraies."}]}},{"domain":4,"lesson":{"title":"Éthique et devoir","text":"L'éthique étudie les raisons de juger les actions. Le conséquentialisme considère les effets et la déontologie insiste sur les devoirs.","example":"Dire la vérité malgré ses conséquences peut opposer deux principes moraux.","questions":[{"id":"extra-9-0","prompt":"Quelle approche juge les conséquences ?","choices":["Le conséquentialisme","Le dualisme","Le scepticisme"],"explanation":"Réponse : Le conséquentialisme. L'éthique étudie les raisons de juger les actions. Le conséquentialisme considère les effets et la déontologie insiste sur les devoirs."},{"id":"extra-9-1","prompt":"Quelle notion est centrale en déontologie ?","choices":["Le devoir","La perspective","La latitude"],"explanation":"Réponse : Le devoir. L'éthique étudie les raisons de juger les actions. Le conséquentialisme considère les effets et la déontologie insiste sur les devoirs."},{"id":"extra-9-2","prompt":"Quelle question relève de l'éthique ?","choices":["Que devrions-nous faire ?","Combien pèse Mars ?","Quelle est la latitude de Paris ?"],"explanation":"Réponse : Que devrions-nous faire ?. L'éthique étudie les raisons de juger les actions. Le conséquentialisme considère les effets et la déontologie insiste sur les devoirs."}]}},{"domain":5,"lesson":{"title":"Probabilités conditionnelles","text":"La probabilité d'un événement peut changer lorsqu'une information supplémentaire est connue. La population de référence est essentielle.","example":"Parmi 20 porteurs de lunettes, 8 sont étudiants : cela représente 40 %.","questions":[{"id":"extra-10-0","prompt":"Combien font 8 sur 20 en pourcentage ?","choices":["40 %","8 %","20 %"],"explanation":"Réponse : 40 %. La probabilité d'un événement peut changer lorsqu'une information supplémentaire est connue. La population de référence est essentielle."},{"id":"extra-10-1","prompt":"Une probabilité conditionnelle utilise-t-elle une information donnée ?","choices":["Oui","Non","Jamais"],"explanation":"Réponse : Oui. La probabilité d'un événement peut changer lorsqu'une information supplémentaire est connue. La population de référence est essentielle."},{"id":"extra-10-2","prompt":"Si deux événements sont indépendants, connaître l'un modifie-t-il la probabilité de l'autre ?","choices":["Non","Oui toujours","Uniquement si elle vaut 50 %"],"explanation":"Réponse : Non. La probabilité d'un événement peut changer lorsqu'une information supplémentaire est connue. La population de référence est essentielle."}]}},{"domain":5,"lesson":{"title":"Fonctions et variations","text":"Une fonction associe une sortie à chaque entrée de son domaine. Une fonction croissante augmente quand son argument augmente.","example":"Pour f(x)=2x+3, f(2)=7.","questions":[{"id":"extra-11-0","prompt":"Pour f(x)=2x+3, combien vaut f(2) ?","choices":["7","5","10"],"explanation":"Réponse : 7. Une fonction associe une sortie à chaque entrée de son domaine. Une fonction croissante augmente quand son argument augmente."},{"id":"extra-11-1","prompt":"Quel est le coefficient directeur de f(x)=−3x+1 ?","choices":["−3","1","3"],"explanation":"Réponse : −3. Une fonction associe une sortie à chaque entrée de son domaine. Une fonction croissante augmente quand son argument augmente."},{"id":"extra-11-2","prompt":"Une fonction strictement croissante fait quoi lorsque x augmente ?","choices":["Elle augmente","Elle diminue","Elle reste constante"],"explanation":"Réponse : Elle augmente. Une fonction associe une sortie à chaque entrée de son domaine. Une fonction croissante augmente quand son argument augmente."}]}},{"domain":6,"lesson":{"title":"Ondes et sons","text":"Le son est une onde mécanique qui nécessite un milieu matériel. Sa fréquence influence la hauteur perçue.","example":"Une corde vibrante fait vibrer l'air, mais le son ne se propage pas dans le vide.","questions":[{"id":"extra-12-0","prompt":"Le son se propage-t-il dans le vide ?","choices":["Non","Oui","Seulement la nuit"],"explanation":"Réponse : Non. Le son est une onde mécanique qui nécessite un milieu matériel. Sa fréquence influence la hauteur perçue."},{"id":"extra-12-1","prompt":"Quelle grandeur influence la hauteur d'un son pur ?","choices":["La fréquence","La masse de l'auditeur","La couleur"],"explanation":"Réponse : La fréquence. Le son est une onde mécanique qui nécessite un milieu matériel. Sa fréquence influence la hauteur perçue."},{"id":"extra-12-2","prompt":"Quelle unité mesure une fréquence ?","choices":["Le hertz","Le joule","Le volt"],"explanation":"Réponse : Le hertz. Le son est une onde mécanique qui nécessite un milieu matériel. Sa fréquence influence la hauteur perçue."}]}},{"domain":6,"lesson":{"title":"Circuits électriques","text":"L'intensité se mesure en ampères, la tension en volts et la résistance en ohms. Pour un conducteur ohmique, U=R×I.","example":"Une résistance de 10 Ω traversée par 2 A présente 20 V.","questions":[{"id":"extra-13-0","prompt":"Quelle unité mesure la résistance ?","choices":["L'ohm","Le volt","Le watt"],"explanation":"Réponse : L'ohm. L'intensité se mesure en ampères, la tension en volts et la résistance en ohms. Pour un conducteur ohmique, U=R×I."},{"id":"extra-13-1","prompt":"Avec R=10 Ω et I=2 A, combien vaut U ?","choices":["20 V","5 V","12 V"],"explanation":"Réponse : 20 V. L'intensité se mesure en ampères, la tension en volts et la résistance en ohms. Pour un conducteur ohmique, U=R×I."},{"id":"extra-13-2","prompt":"Quel appareil mesure l'intensité ?","choices":["Un ampèremètre","Un voltmètre","Un thermomètre"],"explanation":"Réponse : Un ampèremètre. L'intensité se mesure en ampères, la tension en volts et la résistance en ohms. Pour un conducteur ohmique, U=R×I."}]}},{"domain":7,"lesson":{"title":"Inflation et pouvoir d'achat","text":"L'inflation correspond à une hausse générale des prix. Le pouvoir d'achat dépend des revenus par rapport aux prix.","example":"Si les revenus progressent de 2 % et les prix de 5 %, le pouvoir d'achat diminue.","questions":[{"id":"extra-14-0","prompt":"Que désigne l'inflation ?","choices":["Une hausse générale des prix","La hausse d'un seul produit","Une baisse de la population"],"explanation":"Réponse : Une hausse générale des prix. L'inflation correspond à une hausse générale des prix. Le pouvoir d'achat dépend des revenus par rapport aux prix."},{"id":"extra-14-1","prompt":"Si les prix augmentent plus vite que le revenu, le pouvoir d'achat...","choices":["Diminue","Augmente toujours","Reste identique"],"explanation":"Réponse : Diminue. L'inflation correspond à une hausse générale des prix. Le pouvoir d'achat dépend des revenus par rapport aux prix."},{"id":"extra-14-2","prompt":"Quel indice mesure souvent l'inflation ?","choices":["L'indice des prix à la consommation","L'indice de masse corporelle","L'indice de réfraction"],"explanation":"Réponse : L'indice des prix à la consommation. L'inflation correspond à une hausse générale des prix. Le pouvoir d'achat dépend des revenus par rapport aux prix."}]}},{"domain":7,"lesson":{"title":"Institutions démocratiques","text":"Les citoyens élisent des représentants. La séparation des pouvoirs limite leur concentration et les risques d'abus.","example":"Un parlement vote les lois tandis que des tribunaux tranchent les litiges.","questions":[{"id":"extra-15-0","prompt":"Quel pouvoir vote les lois ?","choices":["Le législatif","Le judiciaire","Le monétaire"],"explanation":"Réponse : Le législatif. Les citoyens élisent des représentants. La séparation des pouvoirs limite leur concentration et les risques d'abus."},{"id":"extra-15-1","prompt":"Pourquoi séparer les pouvoirs ?","choices":["Pour limiter leur concentration","Pour supprimer les élections","Pour interdire les lois"],"explanation":"Réponse : Pour limiter leur concentration. Les citoyens élisent des représentants. La séparation des pouvoirs limite leur concentration et les risques d'abus."},{"id":"extra-15-2","prompt":"Comment les citoyens choisissent-ils leurs représentants ?","choices":["Par des élections","Par hérédité automatique","Par tirage au sort obligatoire"],"explanation":"Réponse : Par des élections. Les citoyens élisent des représentants. La séparation des pouvoirs limite leur concentration et les risques d'abus."}]}}];
for(const item of enrichedLessons) domains[item.domain].lessons.push(item.lesson);
const lessons = domains.flatMap(d=>d.lessons);
const questions = lessons.flatMap(l=>l.questions);
const byId = id=>document.getElementById(id);
const work = byId('work');
let state = {};
let session;
let saved = true;
try { state = JSON.parse(localStorage.getItem('mindgap-savoir-v1')) || {}; } catch { saved = false; }
function persist(){
  try { localStorage.setItem('mindgap-savoir-v1',JSON.stringify(state)); saved=true; } catch { saved=false; }
}
const level = q => state[q.id]?.points || 0;
const mastery = items => Math.round(items.reduce((sum,q)=>sum+level(q),0)*50/items.length);
const color = p => 'status'+(p===0?0:p<35?1:p<70?2:p<100?3:4);
const errors = () => questions.filter(q=>state[q.id]?.error);
const escapeHTML = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){
  const p=mastery(questions);
  byId('map').innerHTML='<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'+domains.map((d,i)=>'<line class="'+color(mastery(d.lessons.flatMap(l=>l.questions)))+'" x1="50" y1="50" x2="'+(i<4?17:83)+'" y2="'+(12.5+(i%4)*25)+'"/>').join('')+'</svg><div class="core"><strong>'+p+' %</strong>maîtrise globale</div>';
  domains.forEach((d,i)=>{
    const score=mastery(d.lessons.flatMap(l=>l.questions));
    const button=document.createElement('button');
    button.className='node '+color(score);
    button.style.gridArea=(1+i%4)+'/'+(i<4?1:3);
    button.innerHTML='<b aria-hidden="true">'+d.icon+'</b><span>'+d.name+'<small>'+score+' %</small></span>';
    button.onclick=()=>openDomain(d);
    byId('map').append(button);
  });
  byId('stats').innerHTML='<span><b>'+questions.filter(q=>state[q.id]).length+' / '+questions.length+'</b> questions abordées</span><span><b>'+lessons.filter(l=>mastery(l.questions)===100).length+' / '+lessons.length+'</b> leçons maîtrisées</span><span><b>'+errors().length+'</b> erreurs à revoir</span>'+(saved?'':'<span>Enregistrement indisponible.</span>');
  byId('review').textContent='Revoir mes erreurs'+(errors().length?' · '+errors().length:'');
  byId('start').textContent=Object.keys(state).length?'Poursuivre le parcours':'Commencer le parcours';
}
function show(html, studyMode=false){
  work.parentElement.classList.toggle('study-mode',studyMode);
  work.hidden=false;
  work.innerHTML=html;
  work.focus({preventScroll:true});
  work.scrollIntoView({block:studyMode?'start':'nearest'});
}
const back = '<button id="back">Retour à la carte</button>';
function bindBack(){
  byId('back').onclick=()=>{work.hidden=true;work.parentElement.classList.remove('study-mode');byId('map-title').scrollIntoView({block:'center'});byId('start').focus({preventScroll:true});};
}
function openDomain(d){
  show('<div class="eyebrow">Domaine</div><h2>'+d.name+'</h2><div class="rows">'+d.lessons.map((l,i)=>'<button data-lesson="'+i+'">'+l.title+'<small class="'+color(mastery(l.questions))+'">'+mastery(l.questions)+' %</small></button>').join('')+'</div>'+back);
  work.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(d.lessons[Number(b.dataset.lesson)]));
  bindBack();
}
function openLesson(lesson){
  const domain=domains.find(d=>d.lessons.includes(lesson));
  const unseen=lesson.questions.filter(q=>!state[q.id]);
  const items=unseen.length?unseen:lesson.questions;
  show('<div class="eyebrow">1 / 2 · Apprendre · '+escapeHTML(domain.name)+'</div>'+
    '<h2>'+escapeHTML(lesson.title)+'</h2>'+
    '<div class="lesson-body"><h3>La notion</h3><p>'+escapeHTML(lesson.text)+'</p>'+
    '<div class="lesson-example"><h3>Un exemple</h3><p>'+escapeHTML(lesson.example)+'</p></div></div>'+
    '<div class="actions"><button class="primary" id="launch">'+
    (unseen.length?'Passer au quiz':'Reprendre le quiz')+' · '+items.length+
    (items.length===1?' question':' questions')+'</button>'+back+'</div>',true);
  byId('launch').onclick=()=>launch(lesson.title,items);
  bindBack();
}
function shuffle(items){
  const list=[...items];
  for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]];}
  return list;
}
function launch(title,items,review=false){
  session={title,items:[...items],index:0,correct:0,review};
  ask();
}
function nextLesson(){
  const rounds=Math.max(...domains.map(d=>d.lessons.length));
  const ordered=Array.from({length:rounds},(_,i)=>domains.flatMap(d=>d.lessons.slice(i,i+1))).flat();
  const fresh=ordered.find(l=>l.questions.some(q=>!state[q.id]));
  if(fresh){openLesson(fresh);return;}
  const unfinished=lessons.filter(l=>mastery(l.questions)<100).sort((a,b)=>mastery(a.questions)-mastery(b.questions));
  if(unfinished.length){
    show('<div class="eyebrow">Toutes les notions ont été abordées</div>'+
      '<h2>Consolider mes acquis</h2><p>Reprenez une notion à consolider ou choisissez un autre sujet sur la carte.</p>'+
      '<div class="actions"><button id="consolidate" class="primary">Réviser une notion</button>'+back+'</div>',true);
    byId('consolidate').onclick=()=>openLesson(unfinished[0]);
    bindBack();
    return;
  }
  show('<h2>Parcours maîtrisé</h2><p>Vous avez validé les '+questions.length+' questions. Vous pouvez reprendre une leçon depuis la carte.</p>'+back);
  bindBack();
}
function ask(){
  const s=session,q=s.items[s.index], choices=shuffle(q.choices);
  show('<div class="eyebrow">'+(s.review?'Révision':'2 / 2 · Vérifier')+' · '+escapeHTML(s.title)+' · Question '+(s.index+1)+' / '+s.items.length+'</div><progress aria-label="Progression du quiz" max="'+s.items.length+'" value="'+s.index+'"></progress><h2>'+escapeHTML(q.prompt)+'</h2><div class="answers">'+choices.map((x,i)=>'<button data-answer="'+i+'">'+escapeHTML(x)+'</button>').join('')+'</div><div id="feedback" class="feedback" role="status"></div><button id="next" class="primary" hidden>'+(s.index+1===s.items.length?'Voir le résultat':'Question suivante')+'</button><div>'+back+'</div>',true);
  bindBack();
  const buttons=[...work.querySelectorAll('[data-answer]')];
  buttons.forEach((b,i)=>b.onclick=()=>{
    if(b.disabled)return;
    const correct=choices[i]===q.choices[0];
    if(correct)s.correct++;
    state[q.id]={points:correct?Math.min(2,level(q)+1):Math.max(0,level(q)-1),error:!correct};
    persist();draw();
    buttons.forEach((item,j)=>{item.disabled=true;if(choices[j]===q.choices[0])item.classList.add('right');});
    if(!correct)b.classList.add('wrong');
    byId('feedback').innerHTML='<p><strong>'+(correct?'Bonne réponse.':'Réponse attendue · '+escapeHTML(q.choices[0]))+'</strong> '+escapeHTML(q.explanation)+'</p>';
    work.querySelector('progress').value=s.index+1;
    byId('next').hidden=false;
    byId('next').focus();
  });
  byId('next').onclick=()=>{s.index++;if(s.index<s.items.length)ask();else finish();};
}
function finish(){
  const s=session;
  show('<div class="eyebrow">Résultat du quiz</div><h2>'+s.correct+' / '+s.items.length+' bonnes réponses</h2><p>'+(s.review?'Les erreurs corrigées sont retirées de la liste.':'Deux réussites à une question valident la notion. Une erreur retire une réussite et ajoute la question aux révisions.')+'</p><div class="actions"><button id="continue" class="primary">Poursuivre le parcours</button>'+back+'</div>',true);
  byId('continue').onclick=nextLesson;
  bindBack();
}
byId('start').onclick=nextLesson;
byId('review').onclick=()=>{
  const items=errors();
  if(items.length){launch('Mes révisions',shuffle(items).slice(0,6),true);return;}
  show('<h2>Mes révisions</h2><p>Aucune erreur à revoir. Les questions manquées apparaîtront ici.</p>'+back);
  bindBack();
};
draw();
</script></body></html>
