<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101326">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calcul Mental">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="app.webmanifest">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
<title>Calcul Mental</title>
</head>
<body>
<main>
<header><img src="icon.svg" width="48" height="48" alt=""><h1>Calcul <span>Mental</span></h1></header>
<section class="summary" aria-labelledby="journey">
  <div class="row"><h2 id="journey">Progression totale</h2><strong id="total">0 %</strong></div>
  <progress id="overall" value="0" max="60" aria-labelledby="journey"></progress>
  <div class="row meta"><span id="mastered"></span><span id="streak"></span></div>
</section>
<section class="game" aria-labelledby="level-title">
  <div class="row"><h2 id="level-title"></h2><span class="badge" id="level-count"></span></div>
  <progress id="level-progress" value="0" max="10" aria-labelledby="level-title"></progress>
  <p id="challenge" class="challenge"></p>
  <form id="answer-form" autocomplete="off">
    <label class="sr-only" for="answer">Votre réponse</label>
    <input id="answer" type="text" inputmode="decimal" placeholder="Votre réponse" maxlength="20" enterkeyhint="go" spellcheck="false">
    <button id="submit" class="primary" type="submit">Valider</button>
    <button id="next" class="primary" type="button" hidden>Continuer →</button>
  </form>
  <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
  <details id="help"><summary>Un indice</summary><p id="hint"></p></details>
  <button id="advance" class="primary advance" hidden></button>
</section>
<section aria-labelledby="route-title"><h2 class="route-title" id="route-title">Les niveaux</h2><div id="route" class="route"></div></section>
</main>
</body>
</html>
