<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CHESSFEN</title>

<link rel="apple-touch-icon" href="iconchessfen.png" />
<link rel="icon" href="iconchessfen.png" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CHESSFEN" />
<meta name="theme-color" content="#2c2c2c" />

<style>
:root{
  --bg:#2c2c2c;
  --panel:#3a3a3a;
  --light:#eeeed2;
  --dark:#769656;
  --text:#ffffff;
  --muted:#d7d7d7;
  --accent:#d4af37;
  --danger:#ff745e;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:0 12px calc(18px + env(safe-area-inset-bottom));
}

h1{
  margin:calc(env(safe-area-inset-top) + 18px) 0 12px;
  font-size:28px;
  line-height:1.08;
  font-weight:700;
  text-align:center;
}

.app{
  width:100%;
  max-width:560px;
}

.fen-panel{
  background:var(--panel);
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 8px 20px rgba(0,0,0,.18);
}



.small-btn{
  flex:1;
  text-decoration:none;
  min-height:46px;
  border:none;
  background:#4a4a4a;
  color:#fff;
  font-size:15px;
  font-weight:700;
  padding:0 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
}


#fenInput{
  width:100%;
  min-height:46px;
  border:none;
  background:#4a4a4a;
  color:#fff;
  font-size:15px;
  font-family:ui-monospace,Menlo,monospace;
  padding:12px;
  outline:none;
  appearance:none;
  -webkit-appearance:none;
  border-radius:0;
}

#fenInput::placeholder{
  color:#cfcfcf;
}

#board-container{
  width:95vw;
  max-width:500px;
  aspect-ratio:1 / 1;
  overflow:hidden;
  margin-bottom:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.35);
}

#board{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(8,1fr);
  width:100%;
  height:100%;
}

.square{
  position:relative;
  cursor:default;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  overflow:hidden;
}

.white{ background:var(--light); }
.black{ background:var(--dark); }

.coord{
  position:absolute;
  font-size:10px;
  opacity:.65;
  font-weight:700;
  pointer-events:none;
}

.coord.file{
  left:5px;
  bottom:3px;
}

.coord.rank{
  right:4px;
  top:2px;
}

.piece-wrap{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.piece{
  line-height:1;
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.22));
  transform-origin:center center;
}

/* PIÈCES AGRANDIES ET HOMOGÈNES */
.piece-N,.piece-B,.piece-R,.piece-Q,.piece-K,
.piece-n,.piece-b,.piece-r,.piece-q,.piece-k{
  font-size:clamp(56px, 11vw, 82px);
}

.piece-P{
  font-size:clamp(46px, 9vw, 66px);
  transform:none;
}

.piece-p{
  display:inline-block;
  font-size:clamp(42px, 8.2vw, 60px);
  transform:scale(0.78);
  transform-origin:center center;
  position:relative;
  top:2px;
}

.white-piece{
  color:#ffffff;
  text-shadow:
    0 0 1px #000,
    0 0 2px #000,
    0 1px 2px rgba(0,0,0,.55),
    0 0 6px rgba(255,255,255,.16);
}

.black-piece{
  color:#141414;
  text-shadow:
    0 0 1px rgba(255,255,255,.18),
    0 1px 1px rgba(255,255,255,.06);
}



























@media (max-width:420px){
  .small-btn{
    min-height:44px;
    font-size:14px;
  }


  .piece-N,.piece-B,.piece-R,.piece-Q,.piece-K,
  .piece-n,.piece-b,.piece-r,.piece-q,.piece-k{
    font-size:clamp(50px, 11vw, 70px);
  }

  .piece-P{
    font-size:clamp(42px, 9vw, 58px);
    transform:none;
  }

  .piece-p{
    display:inline-block;
    font-size:clamp(38px, 8vw, 52px);
    transform:scale(0.78);
    transform-origin:center center;
    position:relative;
    top:2px;
  }
}
</style>
</head>
<body>

<h1>CHESSFEN</h1>

<div class="app">
  <div class="fen-panel">
    <input id="fenInput" type="text" placeholder="FEN" spellcheck="false" autocomplete="off" autocapitalize="off" />
  </div>

  <div id="board-container">
    <div id="board"></div>
  </div>

  <div class="fen-panel">
    <div class="small-row">
      <a class="small-btn" id="analyzeLink" href="#">Analyser sur Lichess</a>
    </div>
  </div>
</div>

<script>
const boardEl=document.getElementById("board");
const fenInput=document.getElementById("fenInput");
const analyzeLink=document.getElementById("analyzeLink");

const FILES=["a","b","c","d","e","f","g","h"];
const PIECES={
  "P":"♙","N":"♘","B":"♗","R":"♖","Q":"♕","K":"♔",
  "p":"♟","n":"♞","b":"♝","r":"♜","q":"♛","k":"♚"
};
const FEN_STORAGE_KEY="chessfen-last-fen";
const DEFAULT_FEN="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";

function fenToBoard(fen){
  const rows=fen.trim().split(/\s+/)[0].split("/");
  if(rows.length!==8) return null;
  const b=Array.from({length:8},()=>Array(8).fill(""));
  for(let r=0;r<8;r++){
    let f=0;
    for(const ch of rows[r]){
      if(/[1-8]/.test(ch)) f+=+ch;
      else if("KQRBNPkqrbnp".includes(ch) && f<8){ b[7-r][f]=ch; f++; }
      else return null;
    }
    if(f!==8) return null;
  }
  return b;
}

function fullFen(fen){
  const p=fen.trim().split(/\s+/);
  return [p[0], p[1]||"w", p[2]||"-", p[3]||"-", p[4]||"0", p[5]||"1"].join(" ");
}

function renderBoard(board){
  boardEl.innerHTML="";
  for(let row=7;row>=0;row--){
    for(let col=0;col<8;col++){
      const sq=document.createElement("div");
      sq.className="square "+(((row+col)%2===0)?"black":"white");
      const piece=board[row][col];
      if(piece){
        const wrap=document.createElement("div");
        wrap.className="piece-wrap";
        const span=document.createElement("span");
        span.className="piece "+(piece===piece.toUpperCase()?"white-piece ":"black-piece ")+"piece-"+piece;
        span.textContent=PIECES[piece];
        wrap.appendChild(span);
        sq.appendChild(wrap);
      }
      if(row===0){
        const s=document.createElement("span");
        s.className="coord file"; s.textContent=FILES[col]; sq.appendChild(s);
      }
      if(col===7){
        const s=document.createElement("span");
        s.className="coord rank"; s.textContent=String(row+1); sq.appendChild(s);
      }
      boardEl.appendChild(sq);
    }
  }
}

function update(){
  const value=fenInput.value.trim()||DEFAULT_FEN;
  const board=fenToBoard(value);
  if(!board){
    fenInput.style.outline="2px solid var(--danger)";
    analyzeLink.style.opacity=".4";
    analyzeLink.style.pointerEvents="none";
    return;
  }
  fenInput.style.outline="";
  analyzeLink.style.opacity="";
  analyzeLink.style.pointerEvents="";
  renderBoard(board);
  analyzeLink.href="https://lichess.org/analysis/standard/"+fullFen(value).replace(/ /g,"_");
  try{ localStorage.setItem(FEN_STORAGE_KEY,fenInput.value); }catch(e){}
}

fenInput.addEventListener("input",update);

try{
  const saved=localStorage.getItem(FEN_STORAGE_KEY);
  if(saved) fenInput.value=saved;
}catch(e){}
update();
</script>

</body>
</html>
